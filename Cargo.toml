[workspace]
resolver = "2"
members = ["ncda", "ncda-common", "ncda-ebpf"]
default-members = ["ncda", "ncda-common"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/angristan/ncda"
homepage = "https://github.com/angristan/ncda"

[workspace.dependencies]
aya = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-build = { git = "https://github.com/aya-rs/aya", default-features = false }
aya-ebpf = { git = "https://github.com/aya-rs/aya", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
env_logger = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }
which = { version = "6", default-features = false }

[profile.release.package.ncda-ebpf]
debug = 2
codegen-units = 1
