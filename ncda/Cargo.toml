[package]
name = "ncda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "An ncdu-like terminal monitor for live Linux file I/O"
publish = false

[dependencies]
ncda-common = { path = "../ncda-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
unicode-width = "0.2"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }

[[bin]]
name = "ncda"
path = "src/main.rs"
