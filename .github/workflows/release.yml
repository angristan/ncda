name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version whose assets should be rebuilt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Resolve release version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.automatic.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: Check out validated main
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validated revision
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Node.js
        if: github.event_name == 'workflow_run'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: lts/*

      - name: Record previous release
        if: github.event_name == 'workflow_run'
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Install release tooling
        if: github.event_name == 'workflow_run'
        run: >-
          npm install --no-save --package-lock=false
          semantic-release
          @semantic-release/changelog
          @semantic-release/exec
          @semantic-release/git

      - name: Create release
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Export new version
        if: github.event_name == 'workflow_run'
        id: automatic
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [[ -n "$latest_tag" && "$latest_tag" != "$PREVIOUS_TAG" ]]; then
            echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export requested version
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'invalid semantic version' >&2
            exit 2
          fi
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install userspace Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install nightly-2026-08-04 --profile minimal --component rust-src
          INSTALL_ROOT="$HOME/.local/bin" scripts/install-bpf-linker.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build static binaries
        run: cargo build --release --locked --bins --target '${{ matrix.target }}'

      - name: Package deterministic archive
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/ncda
          install -m 0755 "target/$TARGET/release/ncda" dist/ncda/ncda
          install -m 0755 "target/$TARGET/release/ncda-bench" dist/ncda/ncda-bench
          install -m 0644 README.md dist/ncda/README.md
          strip dist/ncda/ncda dist/ncda/ncda-bench
          archive="ncda-$VERSION-$PLATFORM.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C dist -cf - ncda | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          rm -rf dist/ncda

      - name: Verify packaged binaries
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir dist/verify
          tar -xzf "dist/ncda-$VERSION-$PLATFORM.tar.gz" -C dist/verify
          dist/verify/ncda/ncda --version
          dist/verify/ncda/ncda --help >/dev/null
          dist/verify/ncda/ncda-bench --version
          dist/verify/ncda/ncda-bench --help >/dev/null

      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" dist/*.tar.gz dist/*.sha256 --clobber

  update-homebrew:
    name: Update Homebrew formula
    needs: [release, build-binaries]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::HOMEBREW_TAP_TOKEN is not configured; dispatch skipped'
            exit 0
          fi
          gh api repos/angristan/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f 'client_payload[formula]=ncda' \
            -f "client_payload[version]=$VERSION"
